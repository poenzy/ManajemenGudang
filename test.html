<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Gudang</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .card-title {
        font-size: 1.1rem;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <!-- Tambahkan di dalam <body> bagian container -->
    <div class="container py-5">
      <h2 class="mb-4">Dashboard Gudang</h2>
      <div class="row mb-4">
        <!-- Total Produk -->
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-4 p-3 bg-white h-100">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <div class="bg-primary text-white rounded-circle p-3">
                  <i class="bi bi-box-seam fs-3"></i>
                </div>
              </div>
              <div>
                <h6 class="text-muted mb-1">Total Produk</h6>
                <h4 class="mb-0 fw-bold">1.250</h4>
              </div>
            </div>
          </div>
        </div>

        <!-- Produk Masuk -->
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-4 p-3 bg-white h-100">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <div class="bg-success text-white rounded-circle p-3">
                  <i class="bi bi-box-arrow-in-down fs-3"></i>
                </div>
              </div>
              <div>
                <h6 class="text-muted mb-1">Produk Masuk</h6>
                <h4 class="mb-0 fw-bold">320</h4>
              </div>
            </div>
          </div>
        </div>

        <!-- Produk Keluar -->
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-4 p-3 bg-white h-100">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <div class="bg-danger text-white rounded-circle p-3">
                  <i class="bi bi-box-arrow-up fs-3"></i>
                </div>
              </div>
              <div>
                <h6 class="text-muted mb-1">Produk Keluar</h6>
                <h4 class="mb-0 fw-bold">275</h4>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: Grafik 1 dan 2 -->
      <div class="row mb-4">
        <div class="col-md-8">
          <div class="card shadow-lg card-hover">
            <div class="card-body">
              <h5 class="card-title">Tren Stok Produk (30 Hari Terakhir)</h5>
              <canvas id="productChart" height="200"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-lg card-hover">
            <div class="card-body">
              <h5 class="card-title">Produk Keluar per Kategori</h5>
              <canvas id="outgoingChart" height="250"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 3: Grafik Masuk Lebar Penuh -->
      <div class="row">
        <div class="col-md-12">
          <div class="card shadow-lg card-hover">
            <div class="card-body">
              <h5 class="card-title">Produk Masuk per Kategori</h5>
              <canvas id="incomingChart" height="150"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script Chart.js -->
    <script>
      // Grafik Tren Stok Produk
      new Chart(document.getElementById("productChart"), {
        type: "line",
        data: {
          labels: [
            "1 Mei",
            "5 Mei",
            "10 Mei",
            "15 Mei",
            "20 Mei",
            "25 Mei",
            "30 Mei",
          ],
          datasets: [
            {
              label: "Jumlah Produk",
              data: [1200, 1150, 1125, 1100, 1180, 1225, 1250],
              borderColor: "#0d6efd",
              backgroundColor: "rgba(13,110,253,0.1)",
              fill: true,
              tension: 0.4,
            },
          ],
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: false },
          },
        },
      });

      // Produk Masuk Berdasarkan Kategori
      new Chart(document.getElementById("incomingChart"), {
        type: "bar",
        data: {
          labels: ["Elektronik", "Pakaian", "Alat Tulis", "Makanan", "Minuman"],
          datasets: [
            {
              label: "Jumlah Masuk",
              data: [120, 80, 150, 95, 70],
              backgroundColor: "#198754",
            },
          ],
        },
        options: {
          responsive: true,
          indexAxis: "y",
          scales: {
            x: { beginAtZero: true },
          },
        },
      });

      // Produk Keluar Berdasarkan Kategori
      new Chart(document.getElementById("outgoingChart"), {
        type: "bar",
        data: {
          labels: ["Elektronik", "Pakaian", "Alat Tulis", "Makanan", "Minuman"],
          datasets: [
            {
              label: "Jumlah Keluar",
              data: [100, 60, 110, 80, 55],
              backgroundColor: "#dc3545",
            },
          ],
        },
        options: {
          responsive: true,
          indexAxis: "y",
          scales: {
            x: { beginAtZero: true },
          },
        },
      });
    </script>
  </body>
</html>
